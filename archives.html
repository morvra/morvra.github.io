<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="morvra listsの記事一覧です。">
    <meta property="og:image" content="/ogp.png">
    <title>Archives - morvra lists</title>

    <link rel="stylesheet" href="./styles.css">
    <link rel="stylesheet" href="./news.css">
    <link href="./bullet_icon.png" rel="icon" type="image/x-icon">
    <link href="./bullet_icon.png" rel="shortcut icon">
    <link href="./bullet_icon.png" rel="apple-touch-icon">
    <link rel="stylesheet" type="text/css"
          href="https://netdna.bootstrapcdn.com/font-awesome/4.0.3/css/font-awesome.css">
</head>

<body class="archives-page">

    <div id="header"></div>

    <main>
        <div class="page-heading">
            <h2>Archives</h2>
            <p class="page-description">これまでに書いた記事を新しい順に並べています。</p>
        </div>

        <ul id="article-list">
            <!-- JavaScriptで記事リストを追加 -->
        </ul>
    </main>

    <div id="footer"></div>

    <script src="./archives.js"></script>

    <script>
        fetch("header.html")
            .then(response => response.text())
            .then(data => {
                document.querySelector("#header").innerHTML = data;
            });

        fetch("footer.html")
            .then(response => response.text())
            .then(data => {
                document.querySelector("#footer").innerHTML = data;
            });
    </script>

</body>
</html>
