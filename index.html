<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="morvra lists — 考えたこと、調べたこと、作ったものなどなんでも書く場所。">
    <meta property="og:image" content="/ogp.png">
    <title>morvra lists</title>

    <link rel="stylesheet" href="./styles.css">
    <link href="./bullet_icon.png" rel="icon" type="image/x-icon">
    <link href="./bullet_icon.png" rel="shortcut icon">
    <link href="./bullet_icon.png" rel="apple-touch-icon">
    <link rel="stylesheet" type="text/css"
          href="https://netdna.bootstrapcdn.com/font-awesome/4.0.3/css/font-awesome.css">
</head>

<body>

    <div id="header"></div>

    <main>

        <section class="site-intro">
            <img src="/crow_icon.png" class="site-icon" alt="crow icon">

            <div class="site-intro-text">
                <h1>morvra lists</h1>
                <p>
                    考えたこと、調べたこと、作ったものなど<br>
                    なんでも書く場所。
                </p>
            </div>
        </section>


        <section class="top-section">
            <h2>最近のニュース</h2>

            <div id="latest-news">
                <!-- JavaScriptで最新ニュースを追加 -->
            </div>

            <p class="section-link">
                <a href="/news.html">過去のニュース一覧 »</a>
            </p>
        </section>


        <section class="top-section">
            <h2>今年の記事</h2>

            <ul id="article-list">
                <!-- JavaScriptで今年の記事を追加 -->
            </ul>

            <p class="section-link">
                <a href="/articles.html">記事一覧 »</a>
            </p>
        </section>

    </main>

    <div id="footer"></div>


    <script>
        // ヘッダー
        fetch("header.html")
            .then(response => response.text())
            .then(data => {
                document.querySelector("#header").innerHTML = data;
            });

        // フッター
        fetch("footer.html")
            .then(response => response.text())
            .then(data => {
                document.querySelector("#footer").innerHTML = data;
            });
    </script>

    <script src="./index.js"></script>

</body>
</html>
